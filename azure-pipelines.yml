trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: pe-workflow-azure
  resourceGroup: GWS-Engineering_and_Innovation-Sandbox
  acrName: acrpeworkflowd211
  acrLoginServer: acrpeworkflowd211.azurecr.io
  testService: eligibility

steps:
- checkout: self

- task: GoTool@0
  displayName: 'Install Go 1.22'
  inputs:
    version: '1.22.0'

- script: |
    set -euo pipefail

    cd services

    echo "Running Go tests..."
    go test ./...
  displayName: 'Run Go tests'

- task: AzureCLI@2
  displayName: 'Build and push eligibility image'
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail

      echo "Azure identity:"
      az account show \
        --query "{subscription:name,tenantId:tenantId}" \
        -o table

      echo
      echo "Authenticating Docker to ACR..."
      az acr login \
        --name "$(acrName)"

      echo
      echo "Building $(testService)..."

      docker build \
        --build-arg SERVICE="$(testService)" \
        -f scripts/deploy/services/Dockerfile \
        -t "$(acrLoginServer)/pe-workflow/$(testService):$(Build.BuildId)" \
        -t "$(acrLoginServer)/pe-workflow/$(testService):latest" \
        .

      echo
      echo "Pushing Build ID tag..."

      docker push \
        "$(acrLoginServer)/pe-workflow/$(testService):$(Build.BuildId)"

      echo
      echo "Pushing latest tag..."

      docker push \
        "$(acrLoginServer)/pe-workflow/$(testService):latest"

      echo
      echo "Verifying ACR tags..."

      az acr repository show-tags \
        --name "$(acrName)" \
        --repository "pe-workflow/$(testService)" \
        --output table
