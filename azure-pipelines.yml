trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: pe-workflow-azure
  resourceGroup: rg-pe-workflow-dev

steps:
- checkout: self

- task: AzureCLI@2
  displayName: 'Validate Azure service connection'
  inputs:
    azureSubscription: $(azureServiceConnection)
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |
      set -euo pipefail

      echo "Azure authentication succeeded"
      echo

      echo "Active subscription:"
      az account show \
        --query "{name:name,id:id,tenantId:tenantId}" \
        -o table

      echo
      echo "Validating access to resource group: $(resourceGroup)"

      az group show \
        --name "$(resourceGroup)" \
        --query "{name:name,location:location,id:id}" \
        -o table

      echo
      echo "Container registries in the resource group:"

      az acr list \
        --resource-group "$(resourceGroup)" \
        --query "[].{name:name,loginServer:loginServer,sku:sku.name}" \
        -o table
