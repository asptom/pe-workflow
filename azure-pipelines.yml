# ================================================================
# pe-workflow backend CI/CD (Azure DevOps)
#
# Lifecycle (immutable promotion):
#
#   source -> test -> build once -> push exact artifact -> ACR
#          -> deploy same artifact -> private AKS
#
# Each lifecycle boundary is a separate scripts/deploy.sh action so the
# image deployed to AKS is exactly the image produced by CI (same
# Build.BuildId tag; no rebuild between ACR and AKS):
#
#   Test        go test ./internal/... + compile the six backend services
#   BuildAndPush  deploy.sh --build --services, then --push --services
#               (az acr login is done by the pipeline, not by deploy.sh)
#   Deploy      deploy.sh --deploy --services (kubectl only, no docker)
#
# The pipeline is backend-only by design; the webapp is out of scope here
# (it embeds generated static assets and is built/deployed separately via
# scripts/deploy.sh --webapp).
#
# Kubernetes topology (namespace, ports, probes) is owned by
# scripts/deploy/services/manifests.yaml and is deliberately not
# duplicated in this file.
# ================================================================

trigger:
- main

variables:
  azureServiceConnection: pe-workflow-azure
  resourceGroup: GWS-Engineering_and_Innovation-Sandbox
  aksName: aks-pe-workflow
  acrName: acrpeworkflowd211
  acrLoginServer: acrpeworkflowd211.azurecr.io

stages:

# ================================================================
# Stage 1: Test — Microsoft-hosted Ubuntu
# Go tests for the shared packages plus an explicit compile of all six
# backend services. Deliberately scoped to ./internal/... and the six
# service binaries; backend CI must not pull in other cmd/ targets.
# ================================================================
- stage: Test
  displayName: 'Test backend services'

  jobs:

  - job: TestBackend
    displayName: 'Go test and compile the six backend services'

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self
      clean: true

    - task: GoTool@0
      displayName: 'Install Go 1.22'
      inputs:
        version: '1.22.0'

    - script: |
        set -Eeuo pipefail

        cd services

        echo "Running Go tests for shared packages..."
        go test ./internal/...

        echo
        echo "Compiling the six backend services..."

        for svc in \
          eligibility \
          verification \
          scheduling \
          documents \
          notifications \
          simulator
        do
          echo "  go build ./cmd/${svc}"
          go build "./cmd/${svc}"
        done

      displayName: 'Test shared packages and compile backend services'

# ================================================================
# Stage 2: BuildAndPush — Microsoft-hosted Ubuntu
# The pipeline authenticates Docker to ACR (az acr login); deploy.sh
# only builds and then pushes. The immutable Build.BuildId tag is the
# release identity: no 'latest' push and never --all-tags.
# ================================================================
- stage: BuildAndPush
  displayName: 'Build and push backend images'

  dependsOn: Test
  condition: succeeded()

  jobs:

  - job: BuildAndPushImages
    displayName: 'Build and push the six backend images'

    pool:
      vmImage: ubuntu-latest

    steps:

    - checkout: self
      clean: true

    - task: AzureCLI@2
      displayName: 'Build and push backend images to ACR'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -Eeuo pipefail

          echo "Azure identity:"
          az account show \
            --query "{subscription:name,tenantId:tenantId}" \
            -o table

          echo
          echo "Authenticating Docker to ACR..."

          az acr login \
            --name "$(acrName)"

          echo
          echo "Building the six backend images (tag: $(Build.BuildId))..."

          REGISTRY="$(acrLoginServer)" TAG="$(Build.BuildId)" ./scripts/deploy.sh --build --services

          echo
          echo "Pushing the six backend images (tag: $(Build.BuildId))..."

          REGISTRY="$(acrLoginServer)" TAG="$(Build.BuildId)" ./scripts/deploy.sh --push --services

# ================================================================
# Stage 3: Deploy — self-hosted vm-jumpbox (private AKS)
# Deploys the exact images built in the previous stage (same
# Build.BuildId tag). No docker build/push, no webapp, no hard-coded
# ports, no duplicated namespace: deploy.sh resolves the namespace
# from the canonical manifests / cluster.
# ================================================================
- stage: Deploy
  displayName: 'Deploy backend images to AKS'

  dependsOn: BuildAndPush
  condition: succeeded()

  jobs:

  - job: DeployBackend
    displayName: 'Deploy backend images through vm-jumpbox'

    pool:
      name: Default
      demands:
      - Agent.Name -equals vm-jumpbox

    workspace:
      clean: all

    steps:

    - checkout: self
      clean: true

    - task: AzureCLI@2
      displayName: 'Deploy backend images to private AKS'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -Eeuo pipefail

          echo "Deployment configuration:"
          echo "  Resource group: $(resourceGroup)"
          echo "  AKS cluster:    $(aksName)"
          echo "  Registry:       $(acrLoginServer)"
          echo "  Image tag:      $(Build.BuildId)"

          echo
          echo "Retrieving AKS credentials..."

          az aks get-credentials \
            --resource-group "$(resourceGroup)" \
            --name "$(aksName)" \
            --overwrite-existing

          echo
          echo "Verifying connectivity to the private AKS cluster..."

          kubectl get nodes -o wide

          echo
          echo "Applying the canonical backend manifests and waiting for rollouts..."

          REGISTRY="$(acrLoginServer)" TAG="$(Build.BuildId)" ./scripts/deploy.sh --deploy --services

          echo
          echo "AKS deployment completed successfully."
