apiVersion: apps/v1
kind: Deployment
metadata:
  name: eligibility
  namespace: pe-workflow
  labels:
    app: eligibility
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eligibility
  template:
    metadata:
      labels:
        app: eligibility
    spec:
      containers:
        - name: eligibility
          image: acrpeworkflowd211.azurecr.io/pe-workflow/eligibility:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: eligibility
  namespace: pe-workflow
  labels:
    app: eligibility
spec:
  type: ClusterIP
  selector:
    app: eligibility
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
