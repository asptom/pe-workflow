---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pe-eligibility
  namespace: camunda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pe-eligibility
  template:
    metadata:
      labels:
        app: pe-eligibility
    spec:
      containers:
        - name: eligibility
          image: pe-workflow/eligibility:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: ZEEBE_ADDRESS
              value: camunda-zeebe-gateway:26500
            - name: ZEEBE_AUTHORIZATION_SERVER_URL
              value: http://keycloak-service:18080/auth/realms/camunda-platform/protocol/openid-connect/token
            - name: ZEEBE_TOKEN_AUDIENCE
              value: orchestration
            - name: ZEEBE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: c8ctl-credentials
                  key: client-id
            - name: ZEEBE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: c8ctl-credentials
                  key: client-secret
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: pe-eligibility
  namespace: camunda
spec:
  type: ClusterIP
  selector:
    app: pe-eligibility
  ports:
    - port: 8081
      targetPort: 8081
